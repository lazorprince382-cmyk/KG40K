<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone preview · S22 Ultra</title>
  <style>
    :root {
      --bg: #0b1520;
      --panel: #142231;
      --line: #2a3d52;
      --text: #e8eef5;
      --muted: #8fa3b8;
      --accent: #3d8bfd;
      --bezel: #11161d;
      --screen: #000;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at top, #16324f 0%, transparent 55%),
        var(--bg);
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(10, 18, 28, 0.92);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    header p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    select, input[type="url"], button {
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 0 12px;
      font: inherit;
    }
    input[type="url"] { min-width: min(360px, 70vw); }
    button {
      cursor: pointer;
      background: #1c334c;
    }
    button.primary {
      background: var(--accent);
      border-color: #2f74d8;
      color: #fff;
      font-weight: 650;
    }
    button:hover { filter: brightness(1.08); }
    main {
      display: grid;
      place-items: center;
      padding: 28px 16px 40px;
      overflow: auto;
    }
    .stage {
      display: grid;
      gap: 14px;
      justify-items: center;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .phone {
      position: relative;
      background: linear-gradient(160deg, #2a3038, #0d1014 40%, #1a1f27);
      border-radius: 42px;
      padding: 12px;
      box-shadow:
        0 0 0 2px #3a424d,
        0 28px 60px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: width 0.2s ease, height 0.2s ease;
    }
    .phone.landscape {
      border-radius: 36px;
    }
    .phone::before {
      content: "";
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 108px;
      height: 22px;
      border-radius: 14px;
      background: #050607;
      z-index: 2;
      box-shadow: inset 0 0 0 1px #222;
    }
    .phone.landscape::before {
      top: 50%;
      left: 18px;
      transform: translateY(-50%);
      width: 22px;
      height: 108px;
    }
    .screen {
      overflow: hidden;
      border-radius: 32px;
      background: var(--screen);
      width: var(--w);
      height: var(--h);
    }
    .phone.landscape .screen {
      width: var(--h);
      height: var(--w);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      display: block;
    }
    .hint {
      max-width: 520px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .hint code {
      color: #c9ddf5;
      background: #1a2a3c;
      padding: 1px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Phone preview</h1>
      <p>Develop against a real device frame — default Samsung Galaxy S22 Ultra</p>
    </div>
    <div class="controls">
      <label>Device
        <select id="device"></select>
      </label>
      <label>URL
        <input id="url" type="url" spellcheck="false" value="/">
      </label>
      <button type="button" id="reload">Reload</button>
      <button type="button" id="rotate">Rotate</button>
      <button type="button" id="open-tab">Open URL</button>
      <button type="button" class="primary" id="apply">Apply</button>
    </div>
  </header>
  <main>
    <div class="stage">
      <div class="meta" id="meta"></div>
      <div class="phone" id="phone">
        <div class="screen">
          <iframe id="frame" title="App preview" src="/"></iframe>
        </div>
      </div>
      <p class="hint">
        Start the app with <code>npm start</code>, then open
        <code>/phone-preview.html</code>.
        Use the same host as the app so login cookies work inside the frame.
      </p>
    </div>
  </main>
  <script>
    const devices = [
      { id: "s22-ultra", name: "Samsung Galaxy S22 Ultra", width: 384, height: 824, dpr: 3.5 },
      { id: "s22", name: "Samsung Galaxy S22", width: 360, height: 780, dpr: 3 },
      { id: "s21", name: "Samsung Galaxy S21", width: 360, height: 800, dpr: 3 },
      { id: "pixel-7", name: "Google Pixel 7", width: 412, height: 915, dpr: 2.625 },
      { id: "iphone-14-pro", name: "iPhone 14 Pro", width: 393, height: 852, dpr: 3 },
      { id: "iphone-se", name: "iPhone SE", width: 375, height: 667, dpr: 2 }
    ];

    const deviceSelect = document.getElementById("device");
    const urlInput = document.getElementById("url");
    const phone = document.getElementById("phone");
    const frame = document.getElementById("frame");
    const meta = document.getElementById("meta");
    let landscape = false;

    devices.forEach((device) => {
      const option = document.createElement("option");
      option.value = device.id;
      option.textContent = device.name;
      if (device.id === "s22-ultra") option.selected = true;
      deviceSelect.appendChild(option);
    });

    function currentDevice() {
      return devices.find((d) => d.id === deviceSelect.value) || devices[0];
    }

    function applyDevice() {
      const device = currentDevice();
      phone.style.setProperty("--w", `${device.width}px`);
      phone.style.setProperty("--h", `${device.height}px`);
      phone.classList.toggle("landscape", landscape);
      const w = landscape ? device.height : device.width;
      const h = landscape ? device.width : device.height;
      meta.textContent = `${device.name} · ${w}×${h} CSS px · DPR ${device.dpr} · ${landscape ? "landscape" : "portrait"}`;
      document.title = `Phone preview · ${device.name}`;
    }

    function applyUrl() {
      let next = (urlInput.value || "/").trim() || "/";
      if (next.startsWith("http://") || next.startsWith("https://") || next.startsWith("/")) {
        frame.src = next;
      } else {
        frame.src = `/${next.replace(/^\/+/, "")}`;
      }
    }

    deviceSelect.addEventListener("change", applyDevice);
    document.getElementById("apply").addEventListener("click", () => {
      applyDevice();
      applyUrl();
    });
    document.getElementById("reload").addEventListener("click", () => {
      frame.src = frame.src;
    });
    document.getElementById("rotate").addEventListener("click", () => {
      landscape = !landscape;
      applyDevice();
    });
    document.getElementById("open-tab").addEventListener("click", () => {
      window.open(frame.src || urlInput.value || "/", "_blank", "noopener");
    });
    urlInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        applyDevice();
        applyUrl();
      }
    });

    const params = new URLSearchParams(location.search);
    if (params.get("device") && devices.some((d) => d.id === params.get("device"))) {
      deviceSelect.value = params.get("device");
    }
    if (params.get("url")) urlInput.value = params.get("url");
    if (params.get("landscape") === "1") landscape = true;

    applyDevice();
    applyUrl();
  </script>
</body>
</html>
